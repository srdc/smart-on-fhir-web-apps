<div class="vh-100 d-flex flex-column">

  <!-- HEADER (on all pages) -->
  <ui-header *ngIf="patient"
    class="flex-shrink-0"
    [logoSrc]="'assets/stage-circle-white.png'"
    brandText="STAGE"
    (logout)="logout()"
    [tabs]="[
      { label: 'Summary', link: '/summary' },
      { label: 'Interventions', link: '/intervention-plan' },
      { label: 'Shared Links', link: '/shared-links' },
      { label: 'Risks', link: '/form', active: true }
    ].slice(0, $any(user | async)?.resourceType === 'Patient' ? -1 : undefined)
     .concat(canSelectPatient ? [{ label: 'Patients', link: '/import' }] : [])">
  </ui-header>
  <!-- logged in without a patient (user login at another EHR): import a patient's card first -->
  <ui-header *ngIf="!patient && noPatient"
    class="flex-shrink-0"
    [logoSrc]="'assets/stage-circle-white.png'"
    brandText="STAGE"
    (logout)="logout()"
    [tabs]="[{ label: 'Patients', link: '/import' }]">
  </ui-header>

  <!-- BODY -->
  <div class="row g-0 flex-grow-1 min-h-0">

    <!-- SIDEBAR (on all pages) -->
    <div class="col-12 col-lg-3 p-4 overflow-auto align-self-start sticky-lg-top" *ngIf="patient">
      <ui-sidebar
        title="Patient Demographics"
        [rows]="sidebarRows">
        <ul class="nav flex-column overflow-y-auto" style="max-height: 50vh" *ngIf="menuService.menuItems?.length">
          @for (item of menuService.menuItems; track item.label) {
            <li class="nav-item">
              @if (item.header) {
                {{item.label}}
              } @else if (item.routerLink) {
                <a class="nav-link" [routerLink]="item.routerLink"
                   [routerLinkActive]="item.routerLinkActive || item.routerLink" (click)="item.callback ? item.callback() : undefined">{{item.label}}</a>
              } @else if (item.href) {
                <a class="nav-link" [routerLink]="item.href" (click)="item.callback ? item.callback() : undefined">{{item.label}}</a>
              } @else {
                <a class="nav-link" style="cursor: pointer" (click)="item.callback ? item.callback() : undefined">{{item.label}}</a>
              }
            </li>
          }
        </ul>
      </ui-sidebar>
    </div>

    <!-- MAIN CONTENT (router-outlet) -->
    <div [ngClass]="patient ? 'col-12 col-lg-9' : 'col-12'" class="p-4 h-100 overflow-auto">
      @if (loadingError) {
        <div class="alert alert-danger">{{loadingError}}</div>
      }
      <router-outlet></router-outlet>
    </div>

  </div>
</div>
