<!-- Collecting the patient's data from the EHR (feature extraction) -->
<div *ngIf="prefillLoading" class="alert alert-info d-flex align-items-center shadow-sm" role="status">
  <span class="spinner-border me-3" aria-hidden="true"></span>
  <div>
    <strong>Collecting the patient's data from the EHR...</strong><br>
    This may take up to 20-30 seconds.
  </div>
</div>

<!-- Loading the questionnaire -->
<div *ngIf="loading && !prefillLoading && !groups.length" class="text-center py-5">
  <div class="spinner-border text-primary" role="status"></div>
  <p class="mt-3">Loading the questionnaire...</p>
</div>

<div *ngIf="prefillError && !prefillLoading" class="alert alert-warning">{{ prefillError }}</div>

<!-- The answers come from the last saved response -->
<div *ngIf="savedResponse && !prefillLoading"
     class="alert alert-secondary d-flex flex-wrap justify-content-between align-items-center gap-2 shadow-sm">
  <div>
    <i class="bi bi-clock-history me-1"></i>
    These responses were collected on <strong>{{ savedResponse.authored | date:'medium' }}</strong>.
    If you want to collect new data from the EHR, click the button.
  </div>
  <button type="button" class="btn btn-outline-primary btn-sm" (click)="refreshFromEhr()" [disabled]="saving">
    <i class="bi bi-arrow-repeat me-1"></i>Collect new data from EHR
  </button>
</div>

<form *ngIf="!prefillLoading" class="accordion needs-validation">
  <div *ngFor="let group of groups; let i = index" class="accordion-item shadow-sm" [ngClass]="{'mt-0': !i}">
    <div class="accordion-header">
      <button class="accordion-button bg-white" type="button" data-bs-toggle="collapse" [attr.id]="'accordion-btn-' + group.linkId"
              [attr.data-bs-target]="'#accordion-' + group.linkId" aria-expanded="true" [attr.aria-controls]="'accordion-' + group.linkId">
        <div class="d-flex justify-content-between d-flex justify-content-between align-items-center w-100">
          <h5>{{group.text}}</h5>
        </div>
      </button>
      <!--      <div class="risk-ring" [ngClass]="getRiskLevelClass(disease.riskScore)" style="&#45;&#45;value: {{disease.riskScore * 100}}">-->
      <!--        <span>{{disease.riskScore * 100 | number:'1.0-0'}}%</span>-->
      <!--      </div>-->
    </div>
    <div class="accordion-collapse collapse show" [attr.id]="'accordion-' + group.linkId">
      <div class="accordion-body bg-white">
        <div class="row w-100">
          <div class="col-md-6 col-lg-4 mb-4" *ngFor="let q of group.item">
            <rp-question
              [q]="q"
              [isPrefilled]="prefilledAnswers[q.linkId]"
              [answers]="answers"
              (answerChanged)="onAnswerChanged($event)"
            ></rp-question>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Save Button -->
  <button
    (click)="save()"
    class="btn btn-lg mt-3 text-white"
    style="background-color:#e26d35;"
    [disabled]="saving"
  >
    <span *ngIf="!saving">Save Answers and Continue</span>
    <span *ngIf="saving">
          <span class="spinner-border spinner-border-sm me-2" role="status"></span>
          Saving...
        </span>
  </button>
</form>
