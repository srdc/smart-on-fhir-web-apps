<app-study-case-progress-indicator
  *ngIf="isStudyCaseSummary && studyCaseId"
  [caseId]="studyCaseId">
</app-study-case-progress-indicator>

<div class="d-flex">
  <h2 class="h4 mb-3 flex-grow-1">Patient Summary</h2>
  <button *ngIf="!isStudyCaseSummary" class="btn btn-dark btn-sm mb-2" [routerLink]="continueRoute"><i class="bi bi-clipboard2-pulse"></i> Calculate Multi-morbidity Risks</button>
  <button *ngIf="isStudyCaseSummary" class="btn btn-dark btn-sm mb-2" type="button"
      [disabled]="studyContinuePending" (click)="continueStudyCase()">
    <i class="bi bi-clipboard2-pulse"></i> Continue to Patient Information
  </button>
</div>

<div *ngIf="studyContinueError" class="alert alert-danger">{{ studyContinueError }}</div>

<div class="d-flex justify-content-end mb-2">
  <label class="me-2 small text-muted">Items per page</label>
  <select class="form-select form-select-sm" style="width:auto"
          [(ngModel)]="itemsPerPage">
    <option [ngValue]="5">5</option>
    <option [ngValue]="10">10</option>
    <option [ngValue]="20">20</option>
    <option [ngValue]="50">50</option>
  </select>
</div>

<div class="row g-4">
  <div class="col-lg-6">
    <ui-summary-panel
      [title]="'Conditions'"
      [items]="conditionItems! | paginate: { id: 'conditions', itemsPerPage: itemsPerPage, currentPage: conditionPage }">
    </ui-summary-panel>
    <pagination-controls
      id="conditions"
      *ngIf="(conditionItems?.length || 0) > itemsPerPage"
      (pageChange)="conditionPage = $event"
      previousLabel="Prev"
      nextLabel="Next"
      class="mt-2">
    </pagination-controls>
  </div>

  <div class="col-lg-6">
    <ui-summary-panel
      [title]="'Symptoms'"
      [items]="symptomItems! | paginate: { id: 'symptoms', itemsPerPage: itemsPerPage, currentPage: symptomPage }">
    </ui-summary-panel>
    <pagination-controls
      id="symptoms"
      *ngIf="(symptomItems?.length || 0) > itemsPerPage"
      (pageChange)="symptomPage = $event"
      previousLabel="Prev"
      nextLabel="Next"
      class="mt-2">
    </pagination-controls>
  </div>

  <div class="col-lg-6">
    <ui-summary-panel
      [title]="'Family History'"
      [items]="familyItems! | paginate: { id: 'family', itemsPerPage: itemsPerPage, currentPage: familyPage }">
    </ui-summary-panel>
    <pagination-controls
      id="family"
      *ngIf="(familyItems?.length || 0) > itemsPerPage"
      (pageChange)="familyPage = $event"
      previousLabel="Prev"
      nextLabel="Next"
      class="mt-2">
    </pagination-controls>
  </div>

  <div class="col-lg-6">
    <ui-summary-panel
      [title]="'Medications'"

    </ui-summary-panel>
    <pagination-controls

  </div>

  <div class="col-lg-6">
    <ui-summary-panel
      [title]="'Laboratory'"

    </ui-summary-panel>
    <pagination-controls
      id="labs"
      *ngIf="(labItems?.length || 0) > itemsPerPage"
      (pageChange)="labPage = $event"

      nextLabel="Next"

  </div>

  <div class="col-lg-6">
    <ui-summary-panel
      [title]="'Vitals'"

    </ui-summary-panel>
    <pagination-controls
      id="vitals"
      *ngIf="(vitalItems?.length || 0) > itemsPerPage"
      (pageChange)="vitalPage = $event"

    </pagination-controls>
  </div>

  <div class="col-lg-6">
    <ui-summary-panel
      [title]="'Lifestyle'"

    </ui-summary-panel>

      previousLabel="Prev"

      class="mt-2">
    </pagination-controls>
  </div>
</div>

<div class="row mt-3">
  <div class="col-12">
    <rp-patient-history [patientId]="patient?.id" [frozenEvents]="historyEvents"></rp-patient-history>
  </div>
</div>
