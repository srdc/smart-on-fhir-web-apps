<div class="d-flex flex-wrap gap-2 align-items-start">
  <h2 class="h4 mb-3 flex-grow-1">Patient Summary</h2>
  <button class="btn btn-outline-dark btn-sm mb-2" (click)="downloadIPS()" [disabled]="!patient || ipsLoading">
    <span *ngIf="ipsLoading" class="spinner-border spinner-border-sm" aria-hidden="true"></span>
    <i *ngIf="!ipsLoading" class="bi bi-file-earmark-medical"></i> Download IPS
  </button>
  <button *ngIf="healthCardProfiles.length" class="btn btn-outline-dark btn-sm mb-2" (click)="shareDialogOpen = true" [disabled]="!patient">
    <i class="bi bi-qr-code"></i> Create Smart Health Card
  </button>
  <button class="btn btn-dark btn-sm mb-2" routerLink="/form"><i class="bi bi-clipboard2-pulse"></i> Calculate Multi-morbidity Risks</button>
</div>

<div *ngIf="sharingError" class="alert alert-danger alert-dismissible small py-2" role="alert">
  {{ sharingError }}
  <button type="button" class="btn-close py-2" aria-label="Close" (click)="sharingError = undefined"></button>
</div>

<!-- Create Smart Health Card dialog -->
<app-share-health-card-dialog *ngIf="shareDialogOpen && patient?.id" [patientId]="patient!.id!" [profiles]="healthCardProfiles"
                              sharedLinksUrl="/shared-links" (closed)="shareDialogOpen = false"></app-share-health-card-dialog>

<div class="d-flex justify-content-end mb-2">
  <label class="me-2 small text-muted">Items per page</label>
  <select class="form-select form-select-sm" style="width:auto"
          [(ngModel)]="itemsPerPage">
    <option [ngValue]="5">5</option>
    <option [ngValue]="10">10</option>
    <option [ngValue]="20">20</option>
    <option [ngValue]="50">50</option>
  </select>
</div>

<div class="panels-container">
  <div class="panel-wrapper">
    <ui-summary-panel
      [title]="'Conditions'"
      [items]="conditionItems! | paginate: { id: 'conditions', itemsPerPage: itemsPerPage, currentPage: conditionPage }">
    </ui-summary-panel>
    <pagination-controls
      id="conditions"
      *ngIf="(conditionItems?.length || 0) > itemsPerPage"
      (pageChange)="conditionPage = $event"
      previousLabel="Prev"
      nextLabel="Next"
      class="mt-2">
    </pagination-controls>
  </div>

  <div class="panel-wrapper">
    <ui-summary-panel
      [title]="'Vitals'"

<div class="row mt-3">
  <div class="col-12">
    <rp-patient-history [patientId]="patient?.id"></rp-patient-history>
  </div>
</div>
