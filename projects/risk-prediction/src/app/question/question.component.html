<div *ngIf="enabled" class="h-100 d-flex flex-column" [class.prefilled-field]="isPrefilled">

  <label class="form-label fw-semibold d-flex"> <!-- flex-grow-1 -->
    {{ q.text }}
    <span class="text-danger" *ngIf="q.required">*</span>
    <!-- Pre-filled indicator badge -->
    <span *ngIf="isPrefilled"
          class="badge bg-secondary ms-2"
          title="This field was pre-filled from existing observations">
      <i class="bi bi-check-circle-fill"></i> EHR
    </span>
  </label>

  <!-- CHOICE QUESTIONS -->
  <ng-container *ngIf="q.type === 'choice'">
    <div *ngFor="let opt of q.answerOption" class="form-check">
      <input
        [type]="q.repeats ? 'checkbox' : 'radio'"
        [name]="q.linkId"
        class="form-check-input"
        [id]="q.linkId + '_' + opt.valueCoding.code"
        [checked]="isChecked(opt.valueCoding.code)"
        (click)="toggleOption(opt.valueCoding.code, isExclusiveOption(opt))"
      >
      <label class="form-check-label" [for]="q.linkId + '_' + opt.valueCoding.code">
        {{ opt.valueCoding.display }}
      </label>
    </div>
  </ng-container>

  <!-- NUMERIC INPUT -->
  <div *ngIf="q.type === 'decimal' || q.type === 'integer'" class="position-relative">
    <input
      class="form-control"
      type="number"
      [value]="answers[q.linkId] ?? ''"
      (input)="onNumericChange(($any($event.target)).value)"
      [required]="q.required"
    >

    <!-- Visual indicator icon for pre-filled numeric fields -->
    <i *ngIf="isPrefilled"
       class="bi bi-check-circle-fill text-secondary position-absolute"
       style="right: 10px; top: 50%; transform: translateY(-50%);">
    </i>
  </div>

  <!-- YES / NO QUESTIONS -->
  <ng-container *ngIf="q.type === 'boolean'">
    <div *ngFor="let opt of booleanOptions" class="form-check">
      <input
        type="radio"
        [name]="q.linkId"
        class="form-check-input"
        [id]="q.linkId + '_' + opt.value"
        [checked]="answers[q.linkId] === opt.value"
        (click)="onBooleanChange(opt.value)"
      >
      <label class="form-check-label" [for]="q.linkId + '_' + opt.value">
        {{ opt.label }}
      </label>
    </div>
  </ng-container>

  <!-- FREE TEXT / DATE INPUT -->
  <input
    *ngIf="q.type === 'string' || q.type === 'text' || q.type === 'date'"
    class="form-control"
    [type]="q.type === 'date' ? 'date' : 'text'"
    [value]="answers[q.linkId] ?? ''"
    (input)="onTextChange(($any($event.target)).value)"
    [required]="q.required"
  >
</div>
