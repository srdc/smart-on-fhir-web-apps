<section class="container py-5" style="max-width: 32rem;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h3 mb-2">Study participant login</h1>
      <p class="text-muted mb-4">Enter the participant ID and PIN provided by the study team.</p>

      <div *ngIf="error" class="alert alert-danger" role="alert">{{ error }}</div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label for="study-participant-id" class="form-label">Participant ID</label>
          <input id="study-participant-id" class="form-control" formControlName="participantId"
                 autocomplete="username" required>
        </div>
        <div class="mb-4">
          <label for="study-participant-pin" class="form-label">PIN</label>
          <input id="study-participant-pin" type="password" class="form-control" formControlName="pin"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="submitting">
          {{ submitting ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>
    </div>
  </div>
</section>
