<nav class="navbar navbar-expand-lg bg-primary navbar-dark">
  <div class="container-fluid justify-content-start">

    <button class="navbar-toggler me-2" type="button" data-bs-toggle="collapse"
      data-bs-target="#navbarToggleExternalContent" aria-controls="navbarToggleExternalContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Brand -->
    <a class="navbar-brand fw-medium d-flex align-items-center" href="/">
      <img
        *ngIf="logoSrc"
        [src]="logoSrc"
        [alt]="logoAlt"
        width="32"
        height="32"
        class="me-2"
      />
      <span>{{ brandText }}</span>
    </a>

    <!-- Tabs -->
    <ul class="navbar-nav ms-4 flex-row d-none d-lg-flex">
      <li class="nav-item me-3" *ngFor="let tab of tabs">
        <a
          class="nav-link px-2"
          [routerLink]="tab.link || null"
          routerLinkActive="active"
        >
          {{ tab.label }}
        </a>
      </li>
    </ul>

    <!-- Right side: Login button -->
    <div class="ms-auto" *ngIf="showLogin">
      <button class="btn btn-outline-light btn-sm" (click)="login.emit()">
        <i class="bi bi-box-arrow-in-right me-1"></i>
        <span>Login</span>
      </button>
    </div>

    <!-- Right side -->
    <div class="ms-auto" *ngIf="showLogout || user">
      <div class="badge bg-white text-primary py-2 me-2" *ngIf="user">
        {{user}}
      </div>
      <!-- Logout button -->
      <button *ngIf="showLogout"
        class="btn btn-outline-light btn-sm"
        (click)="onLogout()"
        [disabled]="loggingOut"
      >
        <i class="bi bi-box-arrow-right me-1"></i>
        <span *ngIf="!loggingOut">Logout</span>
        <span *ngIf="loggingOut">
          <span class="spinner-border spinner-border-sm me-1" role="status"></span>
          Logging out...
        </span>
      </button>
    </div>

  </div>
</nav>
<div class="collapse d-lg-none" id="navbarToggleExternalContent" data-bs-theme="primary">
  <div class="bg-primary p-4 navbar">
    <ul class="navbar-nav ms-4 flex-row">
      <li class="nav-item me-3" *ngFor="let tab of tabs">
        <a
          class="nav-link px-2"
          [routerLink]="tab.link || null"
          routerLinkActive="active"
        >
          {{ tab.label }}
        </a>
      </li>
    </ul>
  </div>
</div>
