<nav class="navbar navbar-expand bg-primary navbar-dark">
  <div class="container-fluid justify-content-start">

    <!-- Brand -->
    <a class="navbar-brand fw-medium d-flex align-items-center" href="/">
      <img
        *ngIf="logoSrc"
        [src]="logoSrc"
        [alt]="logoAlt"
        width="32"
        height="32"
        class="me-2"
      />
      <span>{{ brandText }}</span>
    </a>

    <!-- Tabs -->
    <ul class="navbar-nav ms-4 flex-row">
      <li class="nav-item me-3" *ngFor="let tab of tabs">
        <a
          class="nav-link px-2"
          [routerLink]="tab.link || null"
          routerLinkActive="active"
        >
          {{ tab.label }}
        </a>
      </li>
    </ul>

    <!-- Right-side actions share one layout container so they cannot overlap. -->
    <div class="header-actions ms-auto d-flex align-items-center gap-2 flex-nowrap"
         *ngIf="secondaryActionLabel || showLogout">
      <button
        *ngIf="secondaryActionLabel"
        type="button"
        class="btn btn-link btn-sm text-white-50 text-decoration-none text-nowrap"
        (click)="secondaryAction.emit()"
      >
        {{ secondaryActionLabel }}
      </button>
      <button
        *ngIf="showLogout"
        class="btn btn-outline-light btn-sm"
        (click)="onLogout()"
        [disabled]="loggingOut"
      >
        <i class="bi bi-box-arrow-right me-1"></i>
        <span *ngIf="!loggingOut">Logout</span>
        <span *ngIf="loggingOut">
          <span class="spinner-border spinner-border-sm me-1" role="status"></span>
          Logging out...
        </span>
      </button>
    </div>

  </div>
</nav>
