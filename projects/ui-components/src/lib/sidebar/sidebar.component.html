<div class="px-2">
  <div class="pt-4 mb-2">
    <h2 class="h6 mb-0">{{ title }}</h2>
  </div>

  @if (rows?.length) {
    <!-- one vertically stacked block per field -->
    <div *ngFor="let row of rows" class="mb-2">
      <div class="small text-muted">{{ row.label }}</div>
      <div class="fw-semibold text-dark">
        {{ row.value || '—' }}
      </div>
    </div>
  } @else {
    <div class="small text-muted">No data</div>
  }

  <div class="pt-3 mt-1 border-top border-secondary-subtle opacity-50"></div>
  <ng-content></ng-content>
</div>
