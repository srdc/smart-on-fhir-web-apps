<div class="row mb-2" *ngFor="let section of sections">
  <div class="col-12 fw-bold fs-5 mb-4">
    {{section.title}}
  </div>
  <div class="col-12 col-xl-6 col-xxl-4 mb-4" *ngFor="let app of section.apps">
    <div class="card h-100 bg-white app">
      <a [routerLink]="'/app/' + app.id" class="card-header h-100 bg-white d-flex gap-4 align-items-center text-decoration-none">
        <i *ngIf="app.icon; else img" class="fs-2 fw-bold text-danger" [ngClass]="app.icon"></i>
        <ng-template #img>
          <img *ngIf="app.img" [src]="app.img" width="50rem">
          <div *ngIf="!app.img" class="avatar">{{app.title[0]}}</div>
        </ng-template>
        <div class="flex-grow-1 align-self-start">
          <div class="fs-5 fw-medium" style="color: var(--stage-heading)">{{app.title}}</div>
          <div class="fs-6">{{app.description}}</div>
        </div>
      </a>
      <div class="card-body d-flex flex-column gap-1">
        <div class="d-flex flex-row justify-content-between gap-2">
          <b>Category</b>
          <div class="text-truncate">
            {{app.metadata.category?.join(', ')}}
          </div>
        </div>
        <div class="d-flex flex-row justify-content-between gap-2">
          <b>Keywords</b>
          <div class="d-flex gap-1">
            <div *ngFor="let keyword of app.metadata.keywords" class="badge bg-secondary text-light">
              {{keyword}}
            </div>
          </div>
        </div>
        <div class="d-flex flex-row justify-content-between gap-2">
          <b>Go to app</b>
          <a *ngIf="!(noPatient && app.requiresPatient); else selectPatient" class="icon-link icon-link-hover" [href]="app.url" target="_blank">Open <i class="bi bi-arrow-right-circle"></i></a>
          <ng-template #selectPatient>
            <span class="text-muted small text-end">Needs a patient: select one in STAGE Multi-morbidity Risk Prediction</span>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
